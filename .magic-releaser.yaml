versioning: semver
tagFormat: "v{{version}}"
changelog: CHANGELOG.md
requirePreviousRelease: true

packages:
  - name: dotnet-demo
    files:
      - type: dotnet
        path: EFCoreDemo/EFCoreDemo.csproj
      - type: helm
        path: chart/dotnet-demo/Chart.yaml

# After the release, magic-releaser merges it into develop; a conflict is left
# as a pull request from back-merge/<tag>/develop.
backMerge:
  - develop
