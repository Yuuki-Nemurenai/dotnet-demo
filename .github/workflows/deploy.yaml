name: Deploy

# Manual only. Deployment never rebuilds: it moves the environment's mutable tag
# onto an image that is already in GHCR, either a develop build (run number,
# e.g. 35) or a release (X.Y.Z, e.g. 4.1.0). Run on a vX.Y.Z tag ("Use workflow
# from"), it deploys that release and the version input may be left empty.
on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target deployment environment"
        type: environment
        required: true
        default: production
      version:
        description: "Image to deploy: develop run number (e.g. 35) or release version (e.g. 4.1.0); empty when run on a release tag"
        required: false
        type: string

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  CHART_NAME: dotnet-demo

jobs:
  deploy:
    name: Deploy ${{ github.ref_type == 'tag' && github.ref_name || inputs.version }} to ${{ inputs.environment }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    concurrency:
      group: deploy-${{ inputs.environment }}
      cancel-in-progress: false
    permissions:
      contents: read # for checkout
      packages: write # to move the environment tag onto the image digest
    env:
      ENVIRONMENT: ${{ inputs.environment }}
    steps:
      # On a tag the version comes from the tag; an input that disagrees is an error
      - name: Resolve version
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          version="$INPUT_VERSION"
          if [ "$REF_TYPE" = tag ]; then
            if [ -n "$INPUT_VERSION" ] && [ "$INPUT_VERSION" != "${REF_NAME#v}" ]; then
              echo "::error::Version '$INPUT_VERSION' does not match tag '$REF_NAME'; leave it empty to deploy the tag"
              exit 1
            fi
            version="${REF_NAME#v}"
          elif [ -z "$version" ]; then
            echo "::error::Version is required unless the workflow is run on a release tag"
            exit 1
          fi
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+(\.[0-9]+\.[0-9]+)?$'; then
            echo "::error::'$version' is neither a run number nor a X.Y.Z release version"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Point the environment tag at the image digest
        id: promote
        run: |
          image="$REGISTRY/$IMAGE_NAME"
          digest="$(docker buildx imagetools inspect "$image:$VERSION" \
            --format '{{.Manifest.Digest}}')"
          docker buildx imagetools create --tag "$image:$ENVIRONMENT" "$image@$digest"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Deployment summary
        env:
          DIGEST: ${{ steps.promote.outputs.digest }}
        run: |
          {
            echo "### Deployed $VERSION to $ENVIRONMENT"
            echo ''
            echo "Image: \`$REGISTRY/$IMAGE_NAME@$DIGEST\`"
            echo ''
            echo 'Chart:'
            echo '```sh'
            echo "helm upgrade --install $CHART_NAME \\"
            # Only releases publish the chart; develop builds use the chart from the repo
            if printf '%s' "$VERSION" | grep -q '\.'; then
              echo "  oci://$REGISTRY/${{ github.repository_owner }}/charts/$CHART_NAME \\"
              echo "  --version $VERSION"
            else
              echo "  ./chart/$CHART_NAME \\"
              echo "  --set image.tag=$VERSION"
            fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
