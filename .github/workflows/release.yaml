name: Release

# master is the release branch: every push to it is analysed by magic-releaser,
# which bumps the csproj and the chart, prepends CHANGELOG.md, pushes the
# `chore(release): vX.Y.Z` commit with its tag and creates the GitHub release.
# When a release is made, the same run builds the X.Y.Z image and publishes the
# Helm chart; deployment stays manual (Deploy workflow). A failed image or chart
# job is retried with "Re-run failed jobs".
#
# magic-releaser then merges the release into develop (backMerge in
# .magic-releaser.yaml); a conflict is left as a pull request.
#
# master and develop are protected, so the release commit and the back-merge are
# pushed with a GitHub App token (secrets RELEASE_APP_ID, RELEASE_APP_PRIVATE_KEY);
# the App must be on the bypass list of both branches' rulesets.
on:
  push:
    branches:
      - master

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    # The release commit lands on master and starts this workflow again
    if: ${{ !startsWith(github.event.head_commit.message, 'chore(release):') }}
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      released: ${{ steps.release.outputs.released }}
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
    steps:
      # - name: Create GitHub App token
      #   id: app-token
      #   uses: actions/create-github-app-token@v2
      #   with:
      #     app-id: ${{ secrets.RELEASE_APP_ID }}
      #     private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
          #token: ${{ steps.app-token.outputs.token }}

      # Settings come from .magic-releaser.yaml. The exact release tag makes the
      # action download its checksummed binary; a commit SHA would build it from
      # source. The release commit and the tag are pushed in one atomic push.
      - name: Release
        id: release
        uses: yuki-nemurenai/magic-releaser@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          #token: ${{ steps.app-token.outputs.token }}

  image:
    name: Build image
    needs: release
    if: ${{ needs.release.outputs.released == 'true' }}
    permissions:
      contents: write # for checkout
      packages: write # to push the image to GHCR
    uses: ./.github/workflows/docker-build.yaml
    with:
      ref: ${{ needs.release.outputs.tag }}
      version: ${{ needs.release.outputs.version }}
      # Releases get only their immutable number; `latest` belongs to develop
      tags: |
        type=raw,value=${{ needs.release.outputs.version }}

  # chart:
