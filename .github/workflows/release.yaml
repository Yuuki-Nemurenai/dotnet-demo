name: Release

on:
  push:
    branches:
      - develop

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Release Please
    runs-on: ubuntu-latest
    permissions:
      contents: write # to create the tag and the GitHub release
      pull-requests: write # to open and update the release PR
    outputs:
      published: ${{ steps.release.outputs.release_created }}
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag_name }}
    steps:
      - name: Release Please
        id: release
        uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          target-branch: develop
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # The tag is created with GITHUB_TOKEN, which never triggers `on: push: tags`.
  # Release artifacts therefore have to be chained onto the release job itself.
  image:
    name: Build image
    needs: release
    if: needs.release.outputs.published == 'true'
    permissions:
      contents: read # for checkout
      packages: write # to push the image to GHCR
    uses: ./.github/workflows/docker-build.yaml
    with:
      ref: ${{ needs.release.outputs.tag }}
      version: ${{ needs.release.outputs.version }}

  chart:
    name: Publish chart
    needs: [release, image]
    if: needs.release.outputs.published == 'true'
    permissions:
      contents: write # to attach the packaged chart to the GitHub release
      packages: write # to push the chart to GHCR as an OCI artifact
    uses: ./.github/workflows/helm-publish.yaml
    with:
      ref: ${{ needs.release.outputs.tag }}
      version: ${{ needs.release.outputs.version }}
