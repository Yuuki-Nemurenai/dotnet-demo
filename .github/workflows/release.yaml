name: Release

# master is the release branch: every push to it is analysed by semantic-release,
# which pushes the vX.Y.Z tag, creates the GitHub release and then dispatches the
# Publish workflow on that tag. It commits nothing: the version lives only in the
# tag and is injected into the csproj, the image and the chart at build time.
on:
  push:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Semantic Release
    runs-on: ubuntu-latest
    permissions:
      contents: write # to push the tag and create the GitHub release
      issues: write # to comment on released issues
      pull-requests: write # to comment on released pull requests
      actions: write # to dispatch the Publish workflow for the new tag
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: lts/*

      - name: Install release tooling
        run: npm clean-install

      - name: Verify release tooling signatures
        run: npm audit signatures

      # The tag and the release are made as github-actions[bot]. A tag pushed with
      # GITHUB_TOKEN never triggers `on: push: tags`, but workflow_dispatch does,
      # so Publish is started explicitly by @semantic-release/exec (successCmd).
      - name: Semantic Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx semantic-release
