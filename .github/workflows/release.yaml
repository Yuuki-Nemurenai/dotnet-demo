name: Release

# master is the release branch: every push to it is analysed by magic-releaser,
# which bumps the csproj and the chart, prepends CHANGELOG.md, pushes the
# `chore(release): vX.Y.Z` commit with its tag and creates the GitHub release.
# When a release is made, the same run builds the X.Y.Z image and publishes the
# Helm chart; deployment stays manual (Deploy workflow). A failed image or chart
# job is retried with "Re-run failed jobs".
#
# The release tag is then merged back into develop (back-merge job).
#
# master and develop are protected, so the release commit and the back-merge are
# pushed with a GitHub App token (secrets RELEASE_APP_ID, RELEASE_APP_PRIVATE_KEY);
# the App must be on the bypass list of both branches' rulesets.
on:
  push:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    # The release commit lands on master and starts this workflow again
    if: ${{ !startsWith(github.event.head_commit.message, 'chore(release):') }}
    permissions:
      contents: read
      issues: write
      pull-requests: write
    outputs:
      released: ${{ steps.release.outputs.released }}
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
    steps:
      # - name: Create GitHub App token
      #   id: app-token
      #   uses: actions/create-github-app-token@v2
      #   with:
      #     app-id: ${{ secrets.RELEASE_APP_ID }}
      #     private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
          #token: ${{ steps.app-token.outputs.token }}

      # Settings come from .magic-releaser.yaml. The exact release tag makes the
      # action download its checksummed binary; a commit SHA would build it from
      # source. The release commit and the tag are pushed in one atomic push.
      - name: Release
        id: release
        uses: yuki-nemurenai/magic-releaser@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          #token: ${{ steps.app-token.outputs.token }}

  image:
    name: Build image
    needs: release
    if: ${{ needs.release.outputs.released == 'true' }}
    permissions:
      contents: read # for checkout
      packages: write # to push the image to GHCR
    uses: ./.github/workflows/docker-build.yaml
    with:
      ref: ${{ needs.release.outputs.tag }}
      version: ${{ needs.release.outputs.version }}
      # Releases get only their immutable number; `latest` belongs to develop
      tags: |
        type=raw,value=${{ needs.release.outputs.version }}

  # chart:
  #   name: Publish chart
  #   needs: [release, image]
  #   permissions:
  #     contents: write # to attach the packaged chart to the GitHub release
  #     packages: write # to push the chart to GHCR as an OCI artifact
  #   uses: ./.github/workflows/helm-publish.yaml
  #   with:
  #     ref: ${{ needs.release.outputs.tag }}
  #     version: ${{ needs.release.outputs.version }}

  # The release commit exists only on master: merge the release tag back into
  # develop so its versions and CHANGELOG.md stay current. A conflict is left to
  # a person as a master -> develop pull request.
  back-merge:
    name: Back-merge into develop
    needs: release
    if: ${{ needs.release.outputs.released == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      # - name: Create GitHub App token
      #   id: app-token
      #   uses: actions/create-github-app-token@v2
      #   with:
      #     app-id: ${{ secrets.RELEASE_APP_ID }}
      #     private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - name: Checkout develop
        uses: actions/checkout@v7
        with:
          ref: develop
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
          #token: ${{ steps.app-token.outputs.token }}

      - name: Merge the release into develop
        env:
          # GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.release.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git merge --no-ff "$TAG" -m "chore: back-merge $TAG into develop"; then
            git push origin develop
            echo "### Merged $TAG into develop" >> "$GITHUB_STEP_SUMMARY"
          else
            git merge --abort
            url="$(gh pr create --base develop --head master \
              --title "chore: back-merge $TAG into develop" \
              --body "Merging $TAG into develop conflicts; resolve it here and merge with a merge commit.")"
            echo "::warning::Back-merge of $TAG conflicts, opened $url"
            echo "### Back-merge of $TAG conflicts: $url" >> "$GITHUB_STEP_SUMMARY"
          fi
