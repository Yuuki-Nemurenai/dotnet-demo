name: Build image

on:
  workflow_call:
    inputs:
      ref:
        description: "Git ref to build from; defaults to the commit that triggered the caller"
        required: false
        type: string
        default: ""
      tags:
        description: "docker/metadata-action tag rules, one per line"
        required: true
        type: string
      version:
        description: "Assembly version stamped into the app; empty keeps the Dockerfile default"
        required: false
        type: string
        default: ""
      push:
        description: "Push the image to GHCR; false only checks that it builds"
        required: false
        type: boolean
        default: true
    outputs:
      image:
        description: "Digest-pinned reference of the pushed image"
        value: ${{ jobs.docker.outputs.image }}
      digest:
        description: "Digest of the pushed image"
        value: ${{ jobs.docker.outputs.digest }}

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  docker:
    name: Build${{ inputs.push && ' and push' || '' }} image
    runs-on: ubuntu-latest
    permissions:
      contents: read # for checkout
      packages: write # to push the image to GHCR
    outputs:
      image: ghcr.io/${{ github.repository }}@${{ steps.build.outputs.digest }}
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to the Container registry
        if: inputs.push
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: ${{ inputs.tags }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: ${{ inputs.push }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Stamps the assembly version; other builds keep the Dockerfile default
          build-args: |
            ${{ inputs.version != '' && format('VERSION={0}', inputs.version) || '' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Image summary
        run: |
          {
            echo "### ${{ inputs.push && 'Pushed' || 'Built (not pushed)' }} image"
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo "digest: ${{ steps.build.outputs.digest }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
