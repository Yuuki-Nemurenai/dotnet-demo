name: Publish

# Builds and ships a release tag: the X.Y.Z image and the Helm chart; deployment
# stays manual (Deploy workflow). Dispatched on the new tag by semantic-release
# (Release workflow); to re-publish by hand, run it and pick the tag in
# "Use workflow from".
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  resolve:
    name: Resolve release
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - name: Resolve tag and version
        id: resolve
        env:
          REF_TYPE: ${{ github.ref_type }}
          TAG: ${{ github.ref_name }}
        run: |
          if [ "$REF_TYPE" != tag ] || ! printf '%s' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+'; then
            echo "::error::Publish must run on a vX.Y.Z release tag, not $REF_TYPE '$TAG'"
            exit 1
          fi
          {
            echo "tag=$TAG"
            echo "version=${TAG#v}"
          } >> "$GITHUB_OUTPUT"

  image:
    name: Build image
    needs: resolve
    permissions:
      contents: read # for checkout
      packages: write # to push the image to GHCR
    uses: ./.github/workflows/docker-build.yaml
    with:
      ref: ${{ needs.resolve.outputs.tag }}
      version: ${{ needs.resolve.outputs.version }}
      # Releases get only their immutable number; `latest` belongs to develop
      tags: |
        type=raw,value=${{ needs.resolve.outputs.version }}

  chart:
    name: Publish chart
    needs: [resolve, image]
    permissions:
      contents: write # to attach the packaged chart to the GitHub release
      packages: write # to push the chart to GHCR as an OCI artifact
    uses: ./.github/workflows/helm-publish.yaml
    with:
      ref: ${{ needs.resolve.outputs.tag }}
      version: ${{ needs.resolve.outputs.version }}

