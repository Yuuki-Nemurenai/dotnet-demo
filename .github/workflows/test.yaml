name: Demo App Build

env:
  DOTNET_VERSION: 9.0.x
  PROJECT: EFCoreDemo/EFCoreDemo.csproj

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop

jobs:
  lint-pr:
    name: Validate PR title
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'pull_request' }}
    timeout-minutes: 2
    steps:
      - uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            style
            refactor
            perf
            test
            build
            ci
            chore
            revert
            security

  build:
    name: Build Demo App
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup dotnet
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore dependencies
        run: dotnet restore ${{ env.PROJECT }}

      - name: Dotnet build project
        run: |
          dotnet build ${{ env.PROJECT }} \
            --no-restore \
            --nologo \
            --verbosity quiet \
            --property WarningLevel=0 \
            /clp:ErrorsOnly

      - name: Dotnet test
        run: |
          mapfile -t projects < <(find . -name '*Tests.csproj')
          if [ "${#projects[@]}" -eq 0 ]; then
            echo "::warning::No test projects found - skipping dotnet test"
            exit 0
          fi
          for project in "${projects[@]}"; do
            dotnet test "$project" --nologo --verbosity quiet
          done

  image:
    name: Build image
    needs: build
    if: ${{ github.event_name == 'push' }}
    permissions:
      contents: read # for checkout
      packages: write # to push the image to GHCR
    uses: ./.github/workflows/docker-build.yaml
